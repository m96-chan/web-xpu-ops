name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run lint
      # Runners have no GPU. The suite skips rather than fails there, so this
      # checks that everything compiles and the harness degrades cleanly —
      # the kernels themselves are verified on a machine with an adapter.
      - run: npm test
