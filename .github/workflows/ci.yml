name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run lint
      # The tests import from the source tree and never touch `dist/`, so a
      # broken package — a missing kernel, an op left out of the build — is
      # invisible to them. Building here is what makes it visible before a
      # publish rather than after one.
      - run: npm run build
      # Runners have no GPU. The suite skips rather than fails there, so this
      # checks that everything compiles and the harness degrades cleanly —
      # the kernels themselves are verified on a machine with an adapter.
      - run: npm test
