<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>web-xpu-ops / llm — browser demo</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 860px;
        margin: 2rem auto;
        padding: 0 1rem;
        line-height: 1.5;
      }
      section {
        border: 1px solid #ccc;
        border-radius: 6px;
        padding: 1rem;
        margin-bottom: 1rem;
      }
      textarea {
        width: 100%;
        font-family: inherit;
        box-sizing: border-box;
      }
      pre {
        white-space: pre-wrap;
        word-break: break-word;
        background: #f6f6f6;
        border-radius: 4px;
        padding: 0.5rem;
      }
      progress {
        width: 100%;
      }
      label {
        display: inline-block;
        margin-right: 1rem;
      }
      #stats {
        font-family: ui-monospace, monospace;
        font-size: 0.85rem;
      }
    </style>
  </head>
  <body>
    <h1>web-xpu-ops / llm — browser demo</h1>
    <p>
      issue #106: Sarashina2.2-1B-alibi-v1 (int8, W8A32) を WebGPU 上で実際に生成するデモ。
      重みは <code>/weights/</code> 経由で <code>examples/llm-demo/server.mjs</code> が配信する。
    </p>

    <section id="load">
      <h2>1. 重みロード</h2>
      <button id="loadBtn" type="button">重みをロード</button>
      <progress id="loadProgress" value="0" max="1"></progress>
      <div id="loadStatus"></div>
    </section>

    <section id="gen" hidden>
      <h2>2. 生成</h2>
      <div>
        <label><input type="radio" name="mode" value="style" checked /> スタイラ (buildPrompt)</label>
        <label><input type="radio" name="mode" value="listen" /> 聞く層 (line-format 制約)</label>
      </div>

      <div id="styleControls">
        <label
          >policy
          <select id="policy">
            <option value="full_gear">full_gear (技術文)</option>
            <option value="engage">engage</option>
            <option value="brush_off">brush_off (雑談)</option>
          </select>
        </label>
      </div>

      <div id="listenControls" hidden>
        <label><input type="checkbox" id="listenConstraint" checked /> line-format 制約を有効にする</label>
      </div>

      <div>
        <label
          ><input type="checkbox" id="residentEngine" /> GPU常駐デコード (issue #110, LlamaEngineQ8Resident) —
          未チェックは従来のLlamaEngineQ8</label
        >
      </div>

      <p><textarea id="input" rows="3">新しいGPUを買ったので、ベンチマークを回してみた。思ったより速くて驚いた。</textarea></p>
      <button id="genBtn" type="button">生成</button>

      <h3>プロンプト</h3>
      <pre id="promptPreview"></pre>

      <h3>出力</h3>
      <pre id="output"></pre>

      <div id="stats"></div>
    </section>

    <script type="module" src="dist/bundle.js"></script>
  </body>
</html>
